apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: itam-frontend-rollout
  namespace: itam-production
spec:
  replicas: 5
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 10m }
        - setWeight: 25
        - pause: { duration: 30m }
        - setWeight: 50
        - pause: { duration: 1h }
        - setWeight: 100
      analysis:
        templates:
          - templateName: success-rate-check
        args:
          - name: service-name
            value: itam-frontend
  selector:
    matchLabels:
      app.kubernetes.io/name: itam-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: itam-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/enterprise-org/itam-saas/itam-frontend:2026.8.0
          ports:
            - containerPort: 3000
