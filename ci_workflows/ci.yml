name: Enterprise ITAM CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  static-analysis-and-lint:
    name: Code Validation & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Linter & Static Checks
        run: npm run lint || true

      - name: Dependency Vulnerability Scan (npm audit)
        run: npm audit --audit-level=high || true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Copilot & Storage Service Tests
        run: |
          python3 -m unittest discover -s copilot_service/tests
          python3 -m unittest discover -s object_storage_service/tests

  helm-and-manifest-validation:
    name: Helm Chart Validation & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Helm Lint
        run: helm lint ./helm/itam

      - name: Helm Template Dry-Run (Dev)
        run: helm template itam ./helm/itam -f ./helm/itam/values-dev.yaml > /dev/null

      - name: Helm Template Dry-Run (Production)
        run: helm template itam ./helm/itam -f ./helm/itam/values-production.yaml > /dev/null

  container-build-and-push:
    name: Container Build & Security Scan
    needs: [static-analysis-and-lint, helm-and-manifest-validation]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.app
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/itam-frontend:${{ github.sha }}

      - name: Build & Push Copilot Microservice Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.copilot
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/itam-copilot:${{ github.sha }}

      - name: Build & Push Storage Microservice Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.storage
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/itam-storage:${{ github.sha }}

  gitops-promotion:
    name: GitOps Environment Update & Argo CD Sync Trigger
    needs: [container-build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update GitOps Tag Manifests
        run: |
          echo "Updating GitOps target image tag to ${{ github.sha }}"
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/g' gitops/environments/production/values.yaml

      - name: Output GitOps Promotion Status
        run: |
          echo "GitOps manifest committed. Argo CD will reconcile commit ${{ github.sha }}."
