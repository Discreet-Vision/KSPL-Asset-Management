# Development Environment Helm Values Configuration
global:
  environment: development
  tenantDefault: tenant-dev-01
  cloudProvider: generic

frontend:
  replicaCount: 1
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"
  autoscaling:
    enabled: false

backend:
  replicaCount: 1
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "200m"
      memory: "256Mi"

copilot:
  replicaCount: 1

storage:
  replicaCount: 1

ingress:
  hosts:
    - host: dev.itam.internal
      paths:
        - path: /
          pathType: Prefix
          serviceName: frontend
          servicePort: 3000
